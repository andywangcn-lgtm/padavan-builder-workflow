name: Build firmware

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd gettext autopoint libtool libltdl-dev gawk build-essential ccache fakeroot libglib2.0-dev libfdt-dev libpixman-1-dev zlib1g-dev python3-pip libncurses5-dev libncursesw5-dev

    - name: Get variables
      run: |
        sed -i 's|\r$||g' variables build.config
        . <(cat variables build.config)
        PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
        for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Download sources and toolchain
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C rt-n56u checkout "$PADAVAN_COMMIT"
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C rt-n56u --zstd -xf -

    - name: Fix partitions config for NEWIFI-MINI
      run: |
        BOARD_DIR="rt-n56u/trunk/configs/boards/Ralink/NEWIFI-MINI"
        # 核心修复：如果目录不存在，先强制创建它
        mkdir -p "$BOARD_DIR"
          
        if [ ! -f "$BOARD_DIR/partitions.config" ]; then
          echo "partitions.config not found, creating a default one..."
          DEFAULT_CFG=$(find rt-n56u/trunk/configs/boards -name "partitions.config" | head -n 1)
          if [ -n "$DEFAULT_CFG" ]; then
            cp "$DEFAULT_CFG" "$BOARD_DIR/partitions.config"
            echo "Copied from $DEFAULT_CFG"
          else
            echo "CONFIG_MTD_PART_PARTS=\"192k(u-boot),64k(config),64k(factory),14848k(firmware)\"" > "$BOARD_DIR/partitions.config"
          fi
        fi


    - name: Install themes
      run: |
        if [[ -n $PADAVAN_THEMES ]]; then
          git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
          cp -r themes/common-theme themes/jquery.js rt-n56u/trunk/user/www/n56u_ribbon_fixed

          for theme in $PADAVAN_THEMES; do
            echo "Installing $theme theme"
            cp -r "themes/$theme-theme" rt-n56u/trunk/user/www/n56u_ribbon_fixed
          done
        fi

    - name: Run custom pre-build script
      run: '[[ -f pre-build.sh ]] && . pre-build.sh || :'

    - name: Build firmware
      run: |
          # 1. 在绝对路径下初始化工具链目录
          TOOLCHAIN_DIR="$(pwd)/rt-n56u/toolchain-mipsel/toolchain-3.4.x"
          rm -rf "$(pwd)/rt-n56u/toolchain-mipsel"
          mkdir -p "$TOOLCHAIN_DIR"
          
          echo "Downloading and extracting official toolchain..."
          curl -L https://gitlab.com/api/v4/projects/hadzhioglu%2Fpadavan-ng/packages/generic/toolchain/latest/toolchain.tzst -o toolchain.tzst
          
          # 解压到临时目录后，将内容对齐到标准 toolchain-3.4.x 路径
          mkdir -p temp_tc
          tar -I zstd -xf toolchain.tzst -C temp_tc
          
          # 自动寻找解压出的 bin 目录并将其内容复制到标准位置
          EXTRACTED_BIN=$(find temp_tc -type d -name "bin" | head -n 1)
          if [ -n "$EXTRACTED_BIN" ]; then
            PARENT_DIR=$(dirname "$EXTRACTED_BIN")
            cp -r "$PARENT_DIR"/* "$(pwd)/rt-n56u/toolchain-mipsel/"
          fi
          rm -rf temp_tc
          
          # 如果解压出来的名字不对，手动确保符号链接或目录正确
          if [ ! -d "$TOOLCHAIN_DIR" ]; then
            # 兼容其他可能的目录命名
            ALT_DIR=$(find $(pwd)/rt-n56u/toolchain-mipsel -maxdepth 2 -type d -name "toolchain-3.4.x" | head -n 1)
            if [ -z "$ALT_DIR" ]; then
              # 如果没有找到，把根目录作为 toolchain-3.4.x
              mv $(pwd)/rt-n56u/toolchain-mipsel/* "$TOOLCHAIN_DIR/" 2>/dev/null || true
            fi
          fi
          
          # 2. 最终硬核校验编译器是否存在
          if [ ! -f "$TOOLCHAIN_DIR/bin/mipsel-linux-uclibc-gcc" ]; then
            echo "Error: Compiler not found at $TOOLCHAIN_DIR/bin/mipsel-linux-uclibc-gcc"
            find $(pwd)/rt-n56u -name "mipsel-linux-uclibc-gcc"
            exit 1
          else
            echo "Compiler successfully located at: $TOOLCHAIN_DIR/bin/mipsel-linux-uclibc-gcc"
          fi
          
          # 3. 确保 NEWIFI-MINI 分区配置文件存在
          BOARD_DIR="rt-n56u/trunk/configs/boards/Ralink/NEWIFI-MINI"
          mkdir -p "$BOARD_DIR"
          if [ ! -f "$BOARD_DIR/partitions.config" ]; then
            echo "CONFIG_MTD_PART_PARTS=\"192k(u-boot),64k(config),64k(factory),14848k(firmware)\"" > "$BOARD_DIR/partitions.config"
          fi
          
          # 4. 进入源码目录并开始编译
          cd rt-n56u/trunk
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          cp ../../build.config .config
          
          fakeroot ./build_firmware_modify NEWIFI-MINI
          
          # 5. 提取生成的固件
          FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" \
                          -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
          [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
          echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV


    - name: Run custom post-build script
      run: '[[ -f post-build.sh ]] && . post-build.sh || :'

    - name: Prepare artifacts
      run: |
        cp "rt-n56u/trunk/images/$FW_FILE_NAME" .
        echo "BUILD_TIMESTAMP=$(date '+%Y.%m.%d_%H.%M.%S')" >> $GITHUB_ENV

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rt-n56u_${{ env.CONFIG_VENDOR }}_${{ env.CONFIG_FIRMWARE_PRODUCT_ID }}_${{ env.BUILD_TIMESTAMP }}
        retention-days: 7
        path: |
          ${{ env.FW_FILE_NAME }}
          build.config

    - name: Check firmware size
      run: |
        partitions=rt-n56u/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config
        max_fw_size="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$partitions")"
        fw_size="$(stat -c %s "$FW_FILE_NAME")"

        if ((fw_size > max_fw_size)); then
          fw_size_fmtd="$(numfmt --grouping "$fw_size") bytes"
          max_fw_size_fmtd="$(numfmt --grouping "$max_fw_size") bytes"
          echo "Firmware size ($fw_size_fmtd) exceeds max size ($max_fw_size_fmtd) for your target device"
          exit 1
        fi
